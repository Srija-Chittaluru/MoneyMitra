# Runs the MoneyMitra API + website in containers.
# The database is the PostgreSQL on your own machine (port 5432), NOT a container,
# so there is exactly one database no matter how you start the app.
#
#   cp .env.example .env     # then set JWT_SECRET
#   docker compose up --build
#
# Settings come from the .env file next to this one (see .env.example).
name: moneymitra

services:
  backend:
    build: ./apps/backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # host.docker.internal = "your Mac", as seen from inside a container.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://moneymitra:moneymitra@host.docker.internal:5432/moneymitra}
      # Origin(s) the browser loads the website from.
      CORS_ORIGINS: '["http://localhost:${WEB_PORT:-3000}"]'
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      # Software ID written into exported ITR JSON (see apps/backend/app/core/config.py).
      ITR_SOFTWARE_ID: ${ITR_SOFTWARE_ID:-SW00000000}
    volumes:
      # Uploaded documents survive container rebuilds.
      - documents:/app/storage
    # Lets host.docker.internal work on Linux too (Docker Desktop has it built in).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        # Baked into the website's JavaScript at build time. This is the address
        # your *browser* uses to reach the API, so it is localhost, not "backend".
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  documents:
